<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>calculatrice</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="scripts/scripts.js" defer></script>
</head>

<body>
<h1> Calculatrice</h1>

<div class = "calculatrice">
    <div class = "line1" >
        <textarea id = "entree"> </textarea> <!--/.flex 3 -->
        <button id = "division">./.</button> <!--/.flex 1 -->

    </div>
    <div class = "line2">
        <button id = "number1">1</button>
        <button id = "number2">2</button>
        <button id = "number3">3</button>
        <button id = "multiplication">*</button>
    </div>

    <div class = "line3">
        <button id = "number4">4</button>
        <button id = "number5">5</button>
        <button id = "number6">6</button>
        <button id = "subtration">-</button>
    </div>

    <div class = "line4">
        <button id = "number7">7</button>
        <button id = "number8">8</button>
        <button id = "number9">9</button>
        <button id = "sum">+</button>
    </div>

    <div class = "line5">
        <button id = "number0">0</button>
        <button id = "egual">=</button>
    </div>

    <div class = "clearbutton">
        <button id = "clear">Clear</button>
    </div>

</div>
</body>
</html>
